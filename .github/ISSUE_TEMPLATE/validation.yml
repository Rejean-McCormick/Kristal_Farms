name: Claim validation
description: Validate a technical, economic, ecological, site, connectivity, security, community or market claim
title: "[VALIDATE] "
labels: ["validation"]
body:
  - type: textarea
    id: claim
    attributes:
      label: Claim / assumption
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Current confidence level
      options:
        - Design principle
        - Working assumption
        - Screening evidence
        - Strategic hypothesis
        - Validated site fact
        - Operational result
    validations:
      required: true
  - type: textarea
    id: current_source
    attributes:
      label: Current source / evidence
  - type: textarea
    id: evidence_needed
    attributes:
      label: Evidence required to close or promote
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Where the claim is used or proposed to be used
  - type: textarea
    id: restrictions
    attributes:
      label: Concrete confidentiality / privacy / security restrictions, if any
      description: Public by default; list only a specific restriction that actually applies.
