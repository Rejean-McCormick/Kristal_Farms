name: Strategic hypothesis
description: Track a new strategic idea before it becomes an external project claim
title: "[HYPOTHESIS] "
labels: ["hypothesis", "validation"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the idea without presenting it as proven.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Strategic rationale / owner direction
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence
      description: List files/sources that support only the parts they actually establish.
  - type: textarea
    id: proof
    attributes:
      label: Evidence required to promote the claim
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: Architecture, economics, community/environment, security and release impacts
  - type: dropdown
    id: share
    attributes:
      label: Current share level
      options:
        - Internal only
        - NDA / controlled data room
        - Candidate for external use after validation
    validations:
      required: true
