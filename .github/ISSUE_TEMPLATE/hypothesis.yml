name: Strategic hypothesis
description: Track a strategic idea before it becomes a validated site fact or operational result
title: "[HYPOTHESIS] "
labels: ["hypothesis", "validation"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the idea without presenting it as proven.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Source / strategic rationale
  - type: textarea
    id: evidence
    attributes:
      label: Existing evidence
      description: List only what the current sources actually establish.
  - type: textarea
    id: proof
    attributes:
      label: Evidence required to promote the claim
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Current confidence level
      options:
        - Strategic hypothesis
        - Screening evidence
        - Working assumption
    validations:
      required: true
  - type: textarea
    id: impacts
    attributes:
      label: Architecture, economics, environment/community, security and narrative impacts
