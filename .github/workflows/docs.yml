name: docs
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "contracts/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "contracts/**"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material pymdown-extensions
      - run: mkdocs build --strict
