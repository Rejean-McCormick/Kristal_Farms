notes:
- This overlay is a proposed C0 update; applying it should be treated as explicit project-control adoption.
- Absence from this schedule does not mean automatic eligibility.
- Country-level status is a counterparty-risk control and not a judgment about individuals or populations.
- The schedule is project policy and may be stricter than minimum legal eligibility; transaction-specific Canadian legal review still applies.
- Technology-origin restrictions are separate from counterparty eligibility and are not implied by this schedule.
