policy_version: 2026.08.31-r2-proposed
screening:
  mode: unranked_evidence_screening
  ranking_allowed: false
  priority_inference_allowed: false
energy_hosting:
  community_load_priority_required: true
  planning_margin_is_compute_capacity: false
  multi_mw_compute_requires_generation_concept: true
  compute_siting_variants:
  - generation_side
  - community_side
  - split
  heat_reuse_required: false
  fibre_is_primary_value_export_corridor: true
references:
  external_projects_default_role: external_reference
publication:
  frontend_hiding_counts_as_access_control: false
  restricted_data_in_public_artifacts_allowed: false
international_tenancy:
  policy_contract: international-tenant-governance.yaml
  jurisdiction_schedule: jurisdiction-eligibility.yaml
  counterparty_screening_before_access: true
  numeric_ethics_score_allowed: false
  us_counterparties_eligible_for_tenant_roles: false
  us_counterparty_exclusion_implies_us_technology_embargo: false
  jurisdiction_schedule_enforced: true
  downstream_counterparties_inherit_eligibility: true
  unverified_global_resale_pool_allowed: false
  technology_origin_policy_is_separate: true
tenant_confidentiality:
  content_blind_by_design: true
  tenant_controls_private_keys: true
  routine_private_content_inspection_allowed: false
  operator_key_escrow_required: false
  standing_decryption_backdoor_allowed: false
