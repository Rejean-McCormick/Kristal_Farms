openapi: 3.1.0
info:
  title: Kristal Farms Domain API
  version: 0.1.0
  description: Starter contract for Kristal Farms-specific workflows. OGC feature access is documented separately.
servers:
  - url: /api
paths:
  /v1/policy:
    get:
      summary: Get active Kristal Farms policy
      responses:
        "200":
          description: Active policy
          content:
            application/json:
              schema:
                type: object
  /v1/catalog:
    get:
      summary: Get layer catalog visible to current user
      responses:
        "200":
          description: Layer catalog
  /v1/search:
    get:
      summary: Search entities
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string}
      responses:
        "200": {description: Search results}
  /v1/entities/{entity_type}/{entity_id}:
    get:
      summary: Get entity detail
      parameters:
        - in: path
          name: entity_type
          required: true
          schema: {type: string}
        - in: path
          name: entity_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Entity detail}
        "404": {description: Not found}
  /v1/entities/{entity_type}/{entity_id}/evidence:
    get:
      summary: Get evidence linked to an entity
      parameters:
        - in: path
          name: entity_type
          required: true
          schema: {type: string}
        - in: path
          name: entity_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Evidence list}
  /v1/scenarios:
    post:
      summary: Create a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/scenario.schema.json
      responses:
        "201": {description: Scenario created}
  /v1/scenarios/{scenario_id}/evaluate:
    post:
      summary: Evaluate a scenario
      parameters:
        - in: path
          name: scenario_id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Scenario evaluation}
        "422": {description: Invalid scenario or assumptions}
