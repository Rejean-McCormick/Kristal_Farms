portfolio_version: "2026.08.31-r2-proposed"
status: RESEARCH_ONLY
planning_slots: 12
commitments_claimed: false
jurisdiction_policy: contracts/policy/jurisdiction-eligibility.yaml
candidate_policy: contracts/policy/international-tenant-governance.yaml

portfolio_rules:
  - screen_jurisdiction_and_control_before_outreach_escalation
  - no_candidate_is_a_partner_without_direct_attributable_evidence
  - no_country_or_brand_bypasses_beneficial_ownership_and_effective_control_review
  - downstream_resale_must_preserve_the_same_eligibility_boundary
  - separate_us_origin_technology_review_from_counterparty_eligibility
  - diversify_country_customer_carrier_port_and_site_concentration

service_offers:
  ANCHOR_AI_CAMPUS:
    purpose: firm high-density AI/HPC capacity with staged expansion
    indicative_envelope: "20-100+ MW, to be validated with each prospect"
  FLEXIBLE_TRAINING_NODE:
    purpose: training/HPC/batch capacity using a firm base plus an optional flexible tranche
    indicative_envelope: "initial tranche and curtailment profile to be prospect-defined"
  AIDC_DEVELOPMENT_PARTNERSHIP:
    purpose: co-development of facility, cooling, network and operations interfaces while Kristal Farms develops the energy/site layer
  SELECTIVE_SOVEREIGN_NODE:
    purpose: jurisdiction-controlled or private-cloud deployment where Canadian placement is compatible with sovereignty requirements

candidates:
  - slot: 1
    organization: OVHcloud
    home_jurisdiction: FR
    engagement_tier: CORE_OUTREACH
    target_role: ANCHOR_AI_CAMPUS
    rationale: existing Canadian infrastructure and direct AI/HPC operating experience; test expansion beyond current Beauharnois AI footprint
    hard_gate: Canadian high-density GPU expansion appetite

  - slot: 2
    organization: NAVER Cloud
    home_jurisdiction: KR
    engagement_tier: CORE_OUTREACH
    target_role: ANCHOR_AI_CAMPUS
    rationale: explicit 2026 global AI-factory expansion roadmap from 55 MW toward 100/200 MW and GW scale
    hard_gate: workloads legally/commercially deployable in Canada and non-US downstream allocation

  - slot: 3
    organization: SK Telecom / SK Hyper
    home_jurisdiction: KR
    engagement_tier: CORE_OUTREACH
    target_role: AIDC_DEVELOPMENT_PARTNERSHIP
    rationale: dedicated AI-data-center development capability, telecom integration and very large 2026 AIDC buildout ambition
    hard_gate: willingness to develop outside the Korea-centered 15 GW program

  - slot: 4
    organization: KDDI / Telehouse
    home_jurisdiction: JP
    engagement_tier: CORE_OUTREACH
    target_role: AIDC_DEVELOPMENT_PARTNERSHIP
    rationale: global data-center/network operations, renewable-power posture and commercial liquid-cooling experience
    hard_gate: strategic relevance of a Canadian energy-side node

  - slot: 5
    organization: Verda
    home_jurisdiction: FI
    engagement_tier: CORE_OUTREACH
    target_role: FLEXIBLE_TRAINING_NODE
    rationale: AI-native infrastructure company scaling internationally with next-generation GPU deployments
    hard_gate: beneficial ownership/control and downstream customer allocation under the jurisdiction policy

  - slot: 6
    organization: Civo
    home_jurisdiction: GB
    engagement_tier: CORE_OUTREACH
    target_role: SELECTIVE_SOVEREIGN_NODE
    rationale: sovereign/private AI architecture can be deployed on controlled infrastructure rather than only in one fixed public-cloud region
    hard_gate: Canadian deployment appetite and workload residency constraints

  - slot: 7
    organization: Sakura Internet
    home_jurisdiction: JP
    engagement_tier: SECONDARY_OUTREACH
    target_role: FLEXIBLE_TRAINING_NODE
    rationale: operational containerized Blackwell GPU infrastructure and managed supercomputing experience
    hard_gate: domestic-sovereignty commitments may limit offshore workloads

  - slot: 8
    organization: IONOS
    home_jurisdiction: DE
    engagement_tier: SECONDARY_OUTREACH
    target_role: SELECTIVE_SOVEREIGN_NODE
    rationale: European sovereign cloud with H200 GPU services and a growing AI product layer
    hard_gate: whether Canadian capacity can fit its sovereignty and data-control proposition

  - slot: 9
    organization: Firmus Technologies
    home_jurisdiction: AU
    engagement_tier: STRATEGIC_EXPLORATION
    target_role: AIDC_DEVELOPMENT_PARTNERSHIP
    rationale: renewable-powered AI-factory development, liquid cooling and grid-aware orchestration are unusually close to the Kristal Farms energy-to-compute thesis
    hard_gate: ownership/control review plus strict non-US downstream capacity separation where required

  - slot: 10
    organization: Deutsche Telekom / T-Systems
    home_jurisdiction: DE
    engagement_tier: SELECTIVE_OUTREACH
    target_role: SELECTIVE_SOVEREIGN_NODE
    rationale: proven industrial AI cloud and large Blackwell deployment; useful for industrial/HPC requirements
    hard_gate: current Germany/Europe sovereignty orientation may make Canada unsuitable

  - slot: 11
    organization: Nebius
    home_jurisdiction: NL
    engagement_tier: CONDITIONAL_ONLY
    target_role: FLEXIBLE_TRAINING_NODE
    rationale: infrastructure-partnership model is structurally close to Kristal Farms
    hard_gate: dedicated Canadian non-US capacity pool, because global sales include major US counterparties
    ring_fencing_required: true

  - slot: 12
    organization: Scaleway / iliad
    home_jurisdiction: FR
    engagement_tier: SELECTIVE_OUTREACH
    target_role: SELECTIVE_SOVEREIGN_NODE
    rationale: European GPU cloud and sovereignty alignment; retain as a low-cost test of whether non-European capacity can ever fit a separate product
    hard_gate: explicit European residency posture may make Canadian deployment unsuitable

watchlist_removed_from_core_12:
  - organization: Nscale
    reason: material capacity and growth are strongly tied to Microsoft; re-enter only if a separately contracted non-US pool is commercially credible
  - organization: Infomaniak
    reason: Swiss-only processing/residency posture makes Canadian tenancy unlikely; retain as governance/sustainability benchmark
  - organization: Exoscale
    reason: European-residency posture makes Canadian tenancy unlikely; retain as comparative benchmark
