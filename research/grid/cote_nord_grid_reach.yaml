schema: kristal-grid-reach-research/v2
version: "2026-09-01-assets"
status: research_context
ranking_allowed: false
source_registry: research/grid/electrical_sources.yaml
asset_registry: research/grid/electrical_assets.yaml
purpose: >-
  Lightweight source-backed view of documented electrical infrastructure across the Northern Atlas study geography.
  The layer represents documented generation, substations/grid areas and transmission links across integrated,
  integrated-extension and isolated systems. Connectivity and voltage are source-backed; displayed line geometry remains
  schematic connectivity between documented anchors, not surveyed conductor alignments.

map_policy:
  default_visible: true
  geometry_role: schematic_connectivity_not_engineering_geometry
  measurement_allowed: false
  local_distribution_network_included: false
  note: >-
    Do not render the full provincial or local distribution network. Preserve the trunk transmission skeleton,
    material regional extensions and selected remote/isolated electrical assets needed to understand actual reach
    and asset scale. Node coordinates may be named-facility or area anchors and are not engineering survey points.

