schema: kristal-grid-reach-research/v1
version: "2026-09-01-terminal"
status: research_context
ranking_allowed: false
purpose: >-
  Lightweight view of how far documented existing electrical infrastructure reaches across the
  Northern Atlas study geography: comparative west via Abitibi, north via Poste des Montagnais,
  and east via Natashquan and La Romaine. Connectivity and voltage are source-backed; map lines are
  schematic connections between documented place/facility anchors, not surveyed conductor alignments.

map_policy:
  default_visible: true
  geometry_role: schematic_connectivity_not_engineering_geometry
  measurement_allowed: false
  terminal_gap_degrees: 0.18
  local_distribution_network_included: false
  note: >-
    Do not render the full provincial distribution network. Preserve only the trunk transmission
    skeleton needed to understand west, north and east reach, plus the documented 34.5 kV eastern
    extension. This layer is for comparative network reach, not pole-by-pole distribution detail.

sources:
  - id: hq_bape_romaine_corridor
    publisher: Hydro-Québec / BAPE archive
    title: Raccordement du complexe de la Romaine au réseau de transport — étude de corridors
    url: https://archives.bape.gouv.qc.ca/sections/mandats/La%20Romaine_raccordement/documents/PR3.1/PR3.1.pdf
    reference_date: "2009"
    role: >-
      Documents three 735 kV circuits through Montagnais and Arnaud; the 161 kV Arnaud–Havre-Saint-Pierre
      circuit 1619; the 161 kV Havre-Saint-Pierre–Natashquan circuit 1652 via Johan-Beetz; and regional 315 kV context.
  - id: hq_sm3_existing_315
    publisher: Hydro-Québec
    title: Suréquipement de la centrale de la Sainte-Marguerite-3
    url: https://www.hydroquebec.com/production-reseau/chantiers/projets/surequipementsm3/
    reference_date: "2026"
    role: Confirms the existing 315 kV transmission line from Sainte-Marguerite-3 to Arnaud remains in place.
  - id: hq_la_romaine_connection_2022
    publisher: Hydro-Québec
    title: Hydro-Québec franchit un jalon important dans la décarbonation de ses réseaux autonomes
    url: https://nouvelles.hydroquebec.com/nouvelles/communiques/tout-quebec/hydro-quebec-franchit-un-jalon-important-dans-la-decarbonation-de-ses-reseaux-autonomes.html
    reference_date: "2022-03-29"
    role: Documents commissioning of a 75 km, 34.5 kV line connecting Pointe-Parent / Natashquan area to La Romaine and Unamen Shipu.
  - id: hq_annual_2021_romaine_line
    publisher: Hydro-Québec
    title: Annual Report 2021
    url: https://www.hydroquebec.com/data/documents-donnees/pdf/annual-report-2021-hydro-quebec.pdf
    reference_date: "2021"
    role: States the 75 km eastern line was designed to handle 161 kV but is operated at 34.5 kV.
  - id: hq_abitibi_temiscamingue_map_2019
    publisher: Hydro-Québec
    title: Abitibi-Témiscamingue — réseau de transport d'électricité (regional map)
    url: https://www.hydroquebec.com/data/projets/abitibi-temiscamingue/pdf/2019E1480-a-abitibi-web.pdf
    reference_date: "2019"
    role: Regional map showing 735 kV/315 kV transport context around Abitibi, Amos and Lebel-sur-Quévillon.
  - id: hq_annual_2014_abitibi
    publisher: Hydro-Québec
    title: Annual Report 2014
    url: https://www.hydroquebec.com/data/documents-donnees/pdf/annual-report-2014.pdf
    reference_date: "2014"
    role: Documents Abitibi as a 735/315 kV hub and the west/northwest transport backbone toward northern Québec.
  - id: hq_open_transport_corridors
    publisher: Hydro-Québec Open Data
    title: Planification des travaux de maîtrise de la végétation dans les emprises — réseau de transport
    url: https://donnees.hydroquebec.com/explore/dataset/calendrier-travaux-degagement-transport-json/
    reference_date: "2023"
    role: Optional geometry cross-check; medium-precision rights-of-way context, not measurement geometry.
  - id: qc_toponymy
    publisher: Commission de toponymie du Québec / CGNDB
    title: Official place-name coordinates
    url: https://toponymie.gouv.qc.ca/
    reference_date: "2026-09-01"
    role: Geographic anchors for named places/facilities where exact substation geometry is not published in this layer.

