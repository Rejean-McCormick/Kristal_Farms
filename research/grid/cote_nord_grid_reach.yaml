connections:
  - id: abitibi_chibougamau_735
    name: Abitibi / Amos hub — Chibougamau
    voltage_kv: 735
    voltage_class: major
    status: existing
    endpoint_semantics: west_northern_spine
    source_ids: [hq_annual_2014_abitibi, hq_abitibi_temiscamingue_map_2019, qc_toponymy]
    anchor_ids: [abitibi_hub, chibougamau]
    note: >-
      Comparative western/northwestern transport spine included so the Northern Atlas shows the Abitibi side of the integrated network.
      Displayed route is schematic between regional anchors; it is not the surveyed transmission right-of-way.
  - id: abitibi_lebel_315
    name: Abitibi / Amos hub — Lebel-sur-Quévillon
    voltage_kv: 315
    voltage_class: major
    status: existing
    endpoint_semantics: west_regional_branch
    source_ids: [hq_annual_2014_abitibi, hq_abitibi_temiscamingue_map_2019, qc_toponymy]
    anchor_ids: [abitibi_hub, lebel_sur_quevillon]
    note: Existing regional 315 kV context in western Québec; displayed route is schematic.
  - id: cote_nord_735_north_reach
    name: Arnaud — Poste des Montagnais — northbound 735 kV corridor
    voltage_kv: 735
    voltage_class: major
    status: existing
    endpoint_semantics: north_reach_reference
    source_ids: [hq_bape_romaine_corridor, qc_toponymy]
    anchor_ids: [arnaud_area, montagnais]
    note: >-
      The cited corridor continues toward Churchill Falls in Labrador. The displayed Québec segment is a schematic
      connection between named anchors and is not the surveyed centerline of the transmission right-of-way.
  - id: sm3_arnaud_315
    name: Sainte-Marguerite-3 — Arnaud
    voltage_kv: 315
    voltage_class: major
    status: existing
    endpoint_semantics: inland_generation_branch
    source_ids: [hq_sm3_existing_315, hq_bape_romaine_corridor, qc_toponymy]
    anchor_ids: [arnaud_area, sm3]
    note: Existing 315 kV line confirmed by Hydro-Québec; displayed route is schematic.
  - id: coast_161_arnaud_natashquan
    name: Arnaud — Havre-Saint-Pierre — Johan-Beetz — Natashquan
    voltage_kv: 161
    voltage_class: regional
    status: existing
    endpoint_semantics: east_161kv_reach
    source_ids: [hq_bape_romaine_corridor, qc_toponymy]
    anchor_ids: [arnaud_area, riviere_au_tonnerre, havre_saint_pierre, baie_johan_beetz, natashquan]
    note: >-
      Source documents identify circuit 1619 Arnaud–Havre-Saint-Pierre and circuit 1652 Havre-Saint-Pierre–Natashquan,
      with intermediate coastal substations including Rivière-au-Tonnerre and Johan-Beetz.
  - id: natashquan_la_romaine_34_5
    name: Natashquan / Pointe-Parent — La Romaine / Unamen Shipu
    voltage_kv: 34.5
    design_voltage_kv: 161
    voltage_class: local_extension
    status: existing
    endpoint_semantics: east_main_grid_extension
    source_ids: [hq_la_romaine_connection_2022, hq_annual_2021_romaine_line, qc_toponymy]
    anchor_ids: [natashquan, la_romaine]
    note: >-
      Hydro-Québec reports the line is about 75 km, designed to handle 161 kV and operated at 34.5 kV.
      This is the lightweight eastern reach reference; local distribution beyond the endpoint is intentionally omitted.

