schema: kristal-electrical-projects-research/v1
version: "2026-09-01"
ranking_allowed: false
purpose: >-
  Source-backed external energy and electrical-infrastructure projects relevant to Labrador communities.
  This registry is deliberately separate from grid_reach: planned, studied, funded, rejected and community-scale
  projects must never be rendered as existing transmission merely because they are documented here.
status_policy:
  operating: observed or officially described as commissioned/in service
  active_2026: current official program/project page says active
  procurement_and_preconstruction_2026: current procurement/design activity; construction completion not asserted
  funded_2025: funding announced; commissioning not asserted
  feasibility_study: study or measurement program only
  feasibility_completed_2025: developer reports feasibility complete; construction not asserted
  not_approved_2025_appeal_context: regulator declined approval; appeal/reconsideration context does not make it approved
  active_program_2026: current program is accepting/implementing measures; no generation asset implied
